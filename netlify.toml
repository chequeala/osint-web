# Build settings and site core config
[build]
  base = "/"
  command = "yarn build"
  publish = "build"
  functions = "api"

# Environmental variables and optioanl secrets
[build.environment]
  # Build configuration env vars (uncomment if you want to conigure these)
  # CI="false" # Set CI to false, to prevent warnings from exiting the build
  NODE_VERSION = "22"  # Set the version of Node.js to use

  # Optional secrets and API keys (uncomment if you want to add these)
  # GOOGLE_CLOUD_API_KEY=''     # Google Cloud API key, for running Lighthouse scans
  # BUILT_WITH_API_KEY=''       # BuiltWith API key, for detecting site features
  # REACT_APP_WHO_API_KEY=''    # WhoAPI key, for iniiating client-side whois lookup

# Redirect the /api/* path to the lambda functions
# Reescritura (200, no 301) para que el límite de uso aplique a la API.
# Un análisis completo hace ~35 llamadas: 150 por minuto y por IP permite unos 4 análisis.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

  [redirects.rate_limit]
    window_limit = 150
    window_size = 60
    aggregate_by = ["ip", "domain"]

# For router history mode, ensure pages land on index
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200  

# Sin netlify-plugin-chromium: instalaba Chromium en cada build, pero en Netlify no
# puede arrancar (faltan librerías del sistema). Captura y tecnologías se omiten ahí.

# Set any security headers here
# Mismas cabeceras de seguridad que chequea.la (chequeala_web/public/_headers).
# style-src necesita 'unsafe-inline' por styled-components. Si se agrega un recurso
# de otro dominio, hay que permitirlo aquí o el navegador lo bloqueará.
[[headers]]
  for = "/*"
  [headers.values]
  Strict-Transport-Security = "max-age=31536000; includeSubDomains"
  Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/static/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
